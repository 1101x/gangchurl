<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호문쿨루스 찾기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@300;400;500&display=swap');

:root {
--bg: #0a0a0a;
--ink: #e8e4d9;
--ink-dim: #8a857a;
--accent: #c9a961;
--line: rgba(232, 228, 217, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
overscroll-behavior: none;
}

html {
background-color: #0a0a0a;
min-height: 100%;
}

body {
background-color: #0a0a0a;
background-image:
radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.08) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(201, 169, 97, 0.05) 0%, transparent 50%),
url("data:image/svg+xml,%3Csvg viewBox=‘0 0 200 200’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘n’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘3’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23n)’ opacity=‘0.03’/%3E%3C/svg%3E");
background-attachment: fixed;
background-size: cover, cover, 200px 200px;
color: var(--ink);
font-family: 'Noto Serif KR', 'Cormorant Garamond', serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow-x: hidden;
position: relative;
}

.app {
width: 100%;
max-width: 520px;
padding: 40px 28px;
position: relative;
z-index: 2;
}

.screen {
display: none;
animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.screen.active { display: block; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(12px); }
to { opacity: 1; transform: translateY(0); }
}

/* ===== INTRO ===== */
.intro { text-align: center; padding: 60px 0; }

.intro-mark {
width: 60px;
height: 60px;
margin: 0 auto 48px;
opacity: 0.9;
}

.intro-overline {
font-family: 'Cormorant Garamond', serif;
font-style: italic;
font-size: 14px;
letter-spacing: 0.3em;
color: var(--accent);
text-transform: uppercase;
margin-bottom: 24px;
}

.intro-title {
font-family: ‘Noto Serif KR’, serif;
font-weight: 300;
font-size: 38px;
line-height: 1.3;
margin-bottom: 20px;
letter-spacing: -0.01em;
}

.intro-title .em {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-weight: 400;
color: var(--accent);
}

.intro-desc {
font-size: 14px;
line-height: 1.9;
color: var(--ink-dim);
margin-bottom: 56px;
max-width: 340px;
margin-left: auto;
margin-right: auto;
}

.btn-start {
background: transparent;
border: 1px solid var(--accent);
color: var(--accent);
font-family: ‘Cormorant Garamond’, serif;
font-size: 16px;
letter-spacing: 0.2em;
padding: 16px 48px;
cursor: pointer;
transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
position: relative;
text-transform: uppercase;
}

.btn-start:hover {
background: var(--accent);
color: var(--bg);
letter-spacing: 0.3em;
}

.intro-footer {
margin-top: 80px;
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 13px;
color: var(--ink-dim);
opacity: 0.6;
}

/* ===== QUESTION ===== */
.q-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 48px;
padding-bottom: 20px;
border-bottom: 1px solid var(--line);
}

.q-number {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 14px;
color: var(--accent);
letter-spacing: 0.2em;
}

.q-progress {
display: flex;
gap: 6px;
}

.q-dot {
width: 20px;
height: 1px;
background: var(--line);
transition: background 0.4s;
}

.q-dot.filled { background: var(--accent); }

.q-title {
font-family: ‘Noto Serif KR’, serif;
font-weight: 400;
font-size: 22px;
line-height: 1.55;
margin-bottom: 40px;
letter-spacing: -0.005em;
}

.q-options {
display: flex;
flex-direction: column;
gap: 2px;
}

.q-option {
background: transparent;
border: none;
border-top: 1px solid var(--line);
color: var(--ink);
font-family: ‘Noto Serif KR’, serif;
font-size: 15px;
text-align: left;
padding: 20px 4px 20px 48px;
cursor: pointer;
transition: all 0.3s ease;
line-height: 1.55;
position: relative;
display: block;
width: 100%;
}

.q-option:last-child { border-bottom: 1px solid var(--line); }

.q-option .q-num-tag {
position: absolute;
left: 4px;
top: 22px;
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 13px;
color: var(--ink-dim);
transition: color 0.3s;
letter-spacing: 0.05em;
}

.q-option:hover {
color: var(--accent);
padding-left: 56px;
}

.q-option:hover .q-num-tag {
color: var(--accent);
}

/* ===== RESULT ===== */
.result {
text-align: center;
padding: 40px 0;
}

.result-overline {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 13px;
letter-spacing: 0.35em;
color: var(--ink-dim);
text-transform: uppercase;
margin-bottom: 12px;
}

.result-label {
font-family: ‘Noto Serif KR’, serif;
font-weight: 300;
font-size: 16px;
color: var(--ink-dim);
margin-bottom: 32px;
}

.result-illustration {
width: 100%;
max-width: 360px;
margin: 0 auto 32px;
aspect-ratio: 16/9;
position: relative;
overflow: hidden;
border: 1px solid var(--line);
}

.result-illustration img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

.result-illustration::after {
content: '';
position: absolute;
inset: 0;
box-shadow: inset 0 0 40px rgba(10, 10, 10, 0.6);
pointer-events: none;
}

.result-name-en {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 18px;
letter-spacing: 0.3em;
color: var(--accent);
margin-bottom: 8px;
text-transform: uppercase;
}

.result-name-ko {
font-family: ‘Noto Serif KR’, serif;
font-weight: 500;
font-size: 32px;
letter-spacing: -0.01em;
margin-bottom: 32px;
}

.result-desc {
font-size: 14px;
line-height: 1.95;
color: var(--ink-dim);
max-width: 400px;
margin: 0 auto 48px;
text-align: left;
padding: 24px;
border-top: 1px solid var(--line);
border-bottom: 1px solid var(--line);
}

.result-quote {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 16px;
color: var(--accent);
text-align: center;
margin-bottom: 20px;
line-height: 1.6;
}

.result-actions {
display: flex;
gap: 12px;
justify-content: center;
max-width: 360px;
margin: 0 auto;
}

#capture-target {
padding: 32px 24px 36px;
}

.btn-action {
flex: 1;
background: transparent;
border: 1px solid var(--line);
color: var(--ink);
font-family: ‘Cormorant Garamond’, serif;
font-size: 13px;
letter-spacing: 0.2em;
padding: 14px 0;
cursor: pointer;
transition: all 0.3s;
text-transform: uppercase;
text-align: center;
}

.btn-action:hover {
border-color: var(--accent);
color: var(--accent);
}

.btn-retry {
display: block;
margin: 32px auto 0;
background: none;
border: none;
color: var(--ink-dim);
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 13px;
cursor: pointer;
letter-spacing: 0.15em;
padding: 8px 16px;
transition: color 0.3s;
}

.btn-retry:hover { color: var(--accent); }

.toast {
position: fixed;
bottom: 32px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(--ink);
color: var(--bg);
padding: 12px 24px;
font-family: ‘Cormorant Garamond’, serif;
font-size: 14px;
letter-spacing: 0.1em;
opacity: 0;
transition: all 0.4s;
pointer-events: none;
z-index: 10;
}

.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

@media (max-width: 480px) {
.intro-title { font-size: 30px; }
.q-title { font-size: 19px; }
.result-name-ko { font-size: 26px; }
}
</style>

</head>

  // ===== STATE =====
  let currentQ = 0;
  let scores = { pride: 0, greed: 0, wrath: 0, sloth: 0, lust: 0, gluttony: 0, envy: 0 };
  let answers = [];

  // ===== SCREEN CONTROL =====
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function startTest() {
    currentQ = 0;
    scores = { pride: 0, greed: 0, wrath: 0, sloth: 0, lust: 0, gluttony: 0, envy: 0 };
    answers = [];
    renderQuestion();
    showScreen('screen-question');
  }

  function renderQuestion() {
    const q = questions[currentQ];
    const romans = ['I', 'II', 'III', 'IV', 'V'];
    document.getElementById('q-num').textContent = `${romans[currentQ]}. of V.`;
    document.getElementById('q-title').textContent = q.q;

    // progress dots
    const progress = document.getElementById('q-progress');
    progress.innerHTML = '';
    for (let i = 0; i < questions.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'q-dot' + (i <= currentQ ? ' filled' : '');
      progress.appendChild(dot);
    }

    // shuffle options (Fisher-Yates) — fresh order every render
    const shuffled = [...q.options];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    // render options with numbers
    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    shuffled.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'q-option';
      const num = String(i + 1).padStart(2, '0');
      btn.innerHTML = `<span class="q-num-tag">${num}</span>${opt.text}`;
      btn.style.animationDelay = (0.05 * i) + 's';
      btn.onclick = () => selectOption(opt.sin);
      opts.appendChild(btn);
    });
  }

  function selectOption(sin) {
    scores[sin] += 1;
    answers.push(sin);

    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
      // re-trigger animation
      const screen = document.getElementById('screen-question');
      screen.style.animation = 'none';
      void screen.offsetWidth;
      screen.style.animation = '';
    } else {
      showResult();
    }
  }

  function showResult() {
    // determine winner — tie-break uses last answer (Q5 weight)
    let max = 0;
    let winner = answers[answers.length - 1]; // default to last answer
    for (const [sin, score] of Object.entries(scores)) {
      if (score > max) {
        max = score;
        winner = sin;
      }
    }
    // if last answer is also max, prefer it (tie-break rule)
    const lastSin = answers[answers.length - 1];
    if (scores[lastSin] === max) winner = lastSin;

    const h = homunculi[winner];
    document.getElementById('result-en').textContent = h.en;
    document.getElementById('result-ko').textContent = h.ko;
    document.getElementById('result-quote').textContent = `" ${h.quote} "`;
    document.getElementById('result-body').textContent = h.desc;
    document.getElementById('result-illust').innerHTML = h.svg;

    showScreen('screen-result');
  }

  function retry() {
    startTest();
  }

  function goHome() {
    showScreen('screen-intro');
  }

  // ===== SHARE & SAVE =====
  function shareResult() {
    const ko = document.getElementById('result-ko').textContent;
    const url = window.location.href;
    const shareData = {
      title: '호문쿨루스 테스트',
      text: `나의 호문쿨루스는 ${ko}`,
      url: url
    };

    // mobile: native share sheet
    if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
      navigator.share(shareData).catch(() => {});
    } else {
      // desktop fallback: copy link
      navigator.clipboard.writeText(url).then(
        () => showToast('링크가 복사되었습니다'),
        () => showToast('복사에 실패했습니다')
      );
    }
  }

  async function saveResult() {
    const target = document.getElementById('capture-target');
    const en = document.getElementById('result-en').textContent;

    // wait for image to fully load first
    const img = target.querySelector('img');
    if (img && !img.complete) {
      await new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      });
    }

    showToast('이미지 생성 중...');

    // give the toast a moment to render, then capture
    setTimeout(() => {
      html2canvas(target, {
        backgroundColor: '#0a0a0a',
        scale: 2,
        useCORS: true,
        logging: false
      }).then(canvas => {
        canvas.toBlob(blob => {
          if (!blob) {
            showToast('저장에 실패했습니다');
            return;
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `homunculus-${en.toLowerCase()}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('이미지가 저장되었습니다');
        }, 'image/png');
      }).catch(err => {
        console.error(err);
        showToast('저장에 실패했습니다');
      });
    }, 100);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
